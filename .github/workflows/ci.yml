name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-all:
    name: verify-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Verify all checks
        run: npm run verify:all

name: Obfuscate and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on pushes to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Prepare Build Folder
        run: |
          mkdir -p build
          cp index.html style.css app.js build/
          [ -d data ] && cp -r data build/
          [ -d lib ] && cp -r lib build/
          [ -d engine ] && cp -r engine build/

      - name: Obfuscate JavaScript
        run: |
          npx javascript-obfuscator ./build/app.js --output ./build/app.js --string-array true --rotate-string-array true --shuffle-string-array true --string-array-threshold 0.75 --compact true --control-flow-flattening true --control-flow-flattening-threshold 0.5
          if [ -d "./build/engine" ]; then
            find ./build/engine/ -name "*.js" -exec npx javascript-obfuscator {} --output {} --string-array true --rotate-string-array true --shuffle-string-array true --string-array-threshold 0.75 --compact true --control-flow-flattening true --control-flow-flattening-threshold 0.5 \;
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Deploy the obfuscated build folder
          branch: gh-pages # The output branch for the web link
